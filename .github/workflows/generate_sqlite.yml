name: Live SQLite Generator

on:
  push:
    paths:
      - 'orders.json' # De actie start zodra orders.json verandert
  workflow_dispatch: # Hiermee kun je de actie ook handmatig starten via GitHub

jobs:
  build-sqlite:
    runs-on: ubuntu-latest

    steps:
    - name: Repository ophalen
      uses: actions/checkout@v4

    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: SQL Database genereren uit JSON
      run: |
        python - <<EOF
        import sqlite3
        import json
        import os

        json_file = 'orders.json'
        db_file = 'au_bonheur_des_anges.db'

        # 1. Controleer of het JSON-bestand bestaat, anders maken we een lege lijst
        if os.path.exists(json_file):
            with open(json_file, 'r', encoding='utf-8') as f:
                try:
                    orders = json.load(f)
                except json.JSONDecodeError:
                    orders = []
        else:
            orders = []
            print("orders.json niet gevonden, we maken een lege database.")

        # 2. Verbinden met SQLite database
        conn = sqlite3.connect(db_file)
        cursor = conn.cursor()

        # 3. Tabel aanmaken (afgestemd op jouw app-velden)
        cursor.execute('''
            CREATE TABLE IF NOT EXISTS commands (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                naam TEXT,
                aantal INTEGER,
                prijs REAL,
                text TEXT,
                datum TEXT,
                betaald INTEGER,
                terugbetaald INTEGER
            )
        ''')
        
        # We maken de tabel leeg voor een schone import uit de JSON
        cursor.execute('DELETE FROM commands')

        # 4. Data live invoegen
        for item in orders:
            cursor.execute('''
                INSERT INTO commands (naam, aantal, prijs, text, datum, betaald, terugbetaald)
                VALUES (?, ?, ?, ?, ?, ?, ?)
            ''', (
                item.get('naam', 'Inconnu'),
                int(item.get('aantal', 0)),
                float(item.get('prijs', 0.0)),
                item.get('text', 'Rien'),
                item.get('datum', 'N/A'),
                1 if item.get('betaald') else 0,
                1 if item.get('terugbetaald') else 0
            ))

        conn.commit()
        conn.close()
        print(f"Succesvol {len(orders)} bestellingen verwerkt in {db_file}!")
        EOF

    - name: Gegevens terugsturen naar GitHub Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add au_bonheur_des_anges.db
        git commit -m "Live update: SQLite database gegenereerd [skip ci]" || echo "Geen wijzigingen"
        git push
