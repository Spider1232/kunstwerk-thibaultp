<div class="app-header">

<div class="app-view">

    <div id="orders-container"></div>
</div>

</div>

<script>
    // AUTOMATISCHE INSTELLINGEN VOOR JOUW GITHUB
    const GITHUB_USER = "Spider1232";
    const GITHUB_REPO = "kunstwerk-thibaultp";
    const FILE_PATH = "orders.json";
    
    // PLAK HIER EXACT DEZELFDE SLEUTEL (TOKEN) ALS IN DE FORMULAIRE CODE
    const GITHUB_TOKEN = "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"; 

    let currentSha = "";
    let allItems = [];

    // Functie om de live lijst van GitHub te downloaden
    async function loadOrders() {
        const statusDiv = document.getElementById("status");
        const container = document.getElementById("orders-container");
        container.innerHTML = "";
        
        try {
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            let response = await fetch(url, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });

            if (!response.ok) {
                statusDiv.innerText = "Erreur de chargement ou fichier orders.json introuvable.";
                return;
            }

            const fileData = await response.json();
            currentSha = fileData.sha; // Belangrijk voor eventueel verwijderen
            
            // Decodeer de gecodeerde tekst van GitHub netjes naar gewone tekst (UTF-8 veilig)
            const decodedText = decodeURIComponent(atob(fileData.content).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            
            allItems = JSON.parse(decodedText || "[]");

            if (allItems.length === 0) {
                statusDiv.innerText = "Aucune commande pour le moment.";
                return;
            }

            statusDiv.innerText = ""; // Haal laadtekst weg

            // Bouw de kaartjes voor het scherm
            allItems.forEach((item, index) => {
                const totalCardPrice = (item.aantal * item.prijs).toFixed(2);
                
                let statusBadge = `<span class="badge badge-unpaid">Non payé</span>`;
                if (item.terugbetaald) {
                    statusBadge = `<span class="badge badge-refund">Remboursé</span>`;
                } else if (item.betaald) {
                    statusBadge = `<span class="badge badge-paid">Payé</span>`;
                }

                const card = document.createElement("div");
                card.className = "order-card";
                card.innerHTML = `
                    <div class="order-header">
                        <span class="order-name">${escapeHTML(item.naam)}</span>
                        <span class="order-date">${item.datum || ''}</span>
                    </div>
                    <div class="order-details">
                        <strong>${item.aantal}x</strong> - ${escapeHTML(item.text)}
                    </div>
                    <div class="order-meta">
                        <span class="order-price">${totalCardPrice} €</span>
                        ${statusBadge}
                        <button class="btn-delete" onclick="deleteItem(${index})">Supprimer</button>
                    </div>
                `;
                container.appendChild(card);
            });

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Erreur lors de la connexion avec le Cloud GitHub.";
        }
    }

    // Functie om een bestelling te wissen en de cloud bij te werken
    async function deleteItem(index) {
        if (!confirm("Voulez-vous vraiment supprimer cette commande ?")) return;

        const statusDiv = document.getElementById("status");
        statusDiv.innerText = "Mise à jour du Cloud...";

        // Verwijder het item uit onze lokale lijst
        allItems.splice(index, 1);

        try {
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(allItems, null, 2))));

            let updateResponse = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Suppression d'une commande en direct",
                    content: updatedContentBase64,
                    sha: currentSha
                })
            });

            if (updateResponse.ok) {
                // Herlaad de lijst om de nieuwe status/sha op te halen
                loadOrders();
            } else {
                alert("Erreur lors de la suppression sur GitHub.");
                loadOrders();
            }
        } catch (error) {
            console.error(error);
            alert("Erreur réseau.");
            loadOrders();
        }
    }

    // Veiligheid tegen vreemde tekens in namen/teksten
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    // Start direct met laden als de pagina opent
    window.onload = loadOrders;
</script>
